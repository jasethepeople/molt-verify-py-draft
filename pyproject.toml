[project]
name = "molt-verify"
version = "0.1.0"
description = "Standalone verifier for MoltLedger packages (layer 1)"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.scripts]
molt-verify = "molt_verify.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
